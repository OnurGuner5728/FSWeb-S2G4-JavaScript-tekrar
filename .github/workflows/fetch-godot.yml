name: Fetch Godot 4.7.2
on:
  push:
    branches: [apk-signer-tool-20260913]
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Godot
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-linux
          path: Godot_v4.7.2-stable_linux.x86_64
