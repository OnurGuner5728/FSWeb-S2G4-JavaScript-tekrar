name: Fetch verified APK signer

on:
  push:
    branches:
      - apk-signer-tool-20260913

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download uber-apk-signer
        run: |
          curl -fL --retry 3 -o uber-apk-signer-1.3.0.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar" | sha256sum -c -
          java -jar uber-apk-signer-1.3.0.jar --help >/dev/null
      - name: Upload verified signer
        uses: actions/upload-artifact@v4
        with:
          name: verified-uber-apk-signer
          path: uber-apk-signer-1.3.0.jar
          if-no-files-found: error
